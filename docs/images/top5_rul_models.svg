<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Top five RUL prediction models by test R squared">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}
      .sub{font:400 18px Arial,sans-serif;fill:#526071}
      .card{fill:#fff;stroke:#d9e2ec;stroke-width:1.2;filter:url(#shadow)}
      .rank{font:700 28px Arial,sans-serif;fill:#172033}
      .model{font:700 21px Arial,sans-serif;fill:#172033}
      .meta{font:400 15px Arial,sans-serif;fill:#667789}
      .metric{font:700 20px Arial,sans-serif;fill:#172033}
      .small{font:400 14px Arial,sans-serif;fill:#526071}
      .note{font:400 15px Arial,sans-serif;fill:#667789}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="72" class="title">Топ-5 финальных RUL-конфигураций</text>
  <text x="64" y="104" class="sub">Рейтинг по тестовому коэффициенту детерминации Test R²; все модели относятся к семейству v3_rnn и режиму finetune_cnn</text>
  <rect x="52" y="132" rx="22" width="1176" height="500" class="card"/>
  
  <g>
    <text x="74" y="192" class="rank">1</text>
    <text x="122" y="176" class="model">BiLSTM, 30 эпох</text>
    <text x="122" y="203" class="meta">v3_rnn · finetune_cnn</text>
    <rect x="450" y="158" width="540" height="22" rx="11" fill="#edf2f7"/>
    <rect x="450" y="158" width="505" height="22" rx="11" fill="#2f80ed"/>
    <text x="1016" y="176" class="metric">R² -0.012</text>
    <text x="450" y="210" class="small">MAE 0.224 · RMSE 0.255 · Raw PHM 16.344 · 8.423 мс</text>
  </g>
  <g>
    <text x="74" y="278" class="rank">2</text>
    <text x="122" y="262" class="model">ImprovedTransformer</text>
    <text x="122" y="289" class="meta">v3_rnn · finetune_cnn</text>
    <rect x="450" y="244" width="540" height="22" rx="11" fill="#edf2f7"/>
    <rect x="450" y="244" width="76" height="22" rx="11" fill="#4fb3a5"/>
    <text x="1016" y="262" class="metric">R² -0.358</text>
    <text x="450" y="296" class="small">MAE 0.252 · RMSE 0.296 · Raw PHM 31.119 · 4.090 мс</text>
  </g>
  <g>
    <text x="74" y="364" class="rank">3</text>
    <text x="122" y="348" class="model">BiGRU</text>
    <text x="122" y="375" class="meta">v3_rnn · finetune_cnn</text>
    <rect x="450" y="330" width="540" height="22" rx="11" fill="#edf2f7"/>
    <rect x="450" y="330" width="48" height="22" rx="11" fill="#8a9bb0"/>
    <text x="1016" y="348" class="metric">R² -0.381</text>
    <text x="450" y="382" class="small">MAE 0.250 · RMSE 0.298 · Raw PHM 38.595 · 4.099 мс</text>
  </g>
  <g>
    <text x="74" y="450" class="rank">4</text>
    <text x="122" y="434" class="model">LSTM-Attention, 10 испытаний</text>
    <text x="122" y="461" class="meta">v3_rnn · finetune_cnn</text>
    <rect x="450" y="416" width="540" height="22" rx="11" fill="#edf2f7"/>
    <rect x="450" y="416" width="33" height="22" rx="11" fill="#8a9bb0"/>
    <text x="1016" y="434" class="metric">R² -0.393</text>
    <text x="450" y="468" class="small">MAE 0.253 · RMSE 0.300 · Raw PHM 31.626 · 4.065 мс</text>
  </g>
  <g>
    <text x="74" y="536" class="rank">5</text>
    <text x="122" y="520" class="model">GRU-Attention</text>
    <text x="122" y="547" class="meta">v3_rnn · finetune_cnn</text>
    <rect x="450" y="502" width="540" height="22" rx="11" fill="#edf2f7"/>
    <rect x="450" y="502" width="33" height="22" rx="11" fill="#8a9bb0"/>
    <text x="1016" y="520" class="metric">R² -0.393</text>
    <text x="450" y="554" class="small">MAE 0.256 · RMSE 0.300 · Raw PHM 28.652 · 4.118 мс</text>
  </g>
  <text x="64" y="676" class="note">Примечание: R² остается отрицательным, поэтому RUL-контур описывается как исследовательский прототип, требующий калибровки на промышленных данных.</text>
</svg>
